name: RAG CI Pipeline

on:
  push:
    branches: [ main, upgrade ]
  pull_request:
    branches: [ main ]

jobs:
  # ---- Tests: this job MUST pass (it is the real quality gate) ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  # ---- Lint / format / type-check ----
  # After the formatting pass, ruff and black are real gates. mypy runs as an
  # advisory check (the code isn't fully type-annotated yet), so it reports issues
  # without failing the build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (type check, advisory)
        run: mypy src || true
