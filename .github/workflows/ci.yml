name: RAG CI Pipeline

on:
  push:
    branches: [ main, upgrade ]
  pull_request:
    branches: [ main ]

jobs:
  # ---- Tests: this job MUST pass (it is the real quality gate) ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  # ---- Lint / type-check: reported but NOT blocking yet ----
  # The existing code isn't formatted/typed, so making these gates blocking now
  # would fail the build. continue-on-error lets us SEE the results while we do a
  # formatting pass; flip these to blocking once the codebase is clean.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Mypy (type check)
        run: mypy src
